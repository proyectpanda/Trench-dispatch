name: Import current Trench Dispatch assets

on:
  push:
    paths:
      - '.github/workflows/import-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download current live assets from Cloudflare Pages
        run: |
          curl -fL "https://trenchdispatch.pages.dev/tc_cover.jpg" -o tc_cover.jpg
          curl -fL "https://trenchdispatch.pages.dev/panda.png" -o panda.png
          curl -fL "https://trenchdispatch.pages.dev/Trench-Dispatch.pdf" -o Trench-Dispatch.pdf

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tc_cover.jpg panda.png Trench-Dispatch.pdf
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Import current Trench Dispatch assets"
            git push
          fi
